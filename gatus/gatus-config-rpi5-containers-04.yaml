# Gatus checks for RPi5-Containers-04 (the jumpbox at the second site). Written by home-lab-admin, 2026-11-23.
# This file holds no secrets.

# Alerts are off until the Pi is settled at the second site (Eric, 2026-11-23). To turn them on, add an
# alerting.pushover block and an `alerts: [{type: pushover}]` entry per endpoint, with the token and user key
# from the container's environment.

endpoints:
  - name: Jellyfin
    group: Home over the site link
    url: "http://10.0.0.20:8096/health"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == Healthy"

  - name: Home router
    group: Home over the site link
    url: "icmp://10.0.0.1"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: dns-01 answers
    group: Home over the site link
    url: "10.0.0.21"
    interval: 2m
    dns:
      query-name: "example.com"
      query-type: "A"
    conditions:
      - "[DNS_RCODE] == NOERROR"

  - name: Second site router
    group: Second site
    url: "icmp://10.10.0.1"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: dns-03 answers
    group: Second site
    url: "127.0.0.1"
    interval: 1m
    dns:
      query-name: "example.com"
      query-type: "A"
    conditions:
      - "[DNS_RCODE] == NOERROR"

  - name: dns-03 blocks ads
    group: Second site
    url: "127.0.0.1"
    interval: 5m
    dns:
      query-name: "doubleclick.net"
      query-type: "A"
    conditions:
      - "[DNS_RCODE] == NXDOMAIN"

  - name: Internal names
    group: Second site
    url: "127.0.0.1"
    interval: 5m
    dns:
      query-name: "komodo.eric-post.com"
      query-type: "A"
    conditions:
      - "[BODY] == 10.0.0.15"
