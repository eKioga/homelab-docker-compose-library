# Scan every commit for secrets; push main to the public GitHub copy only when the scan is clean.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest   # nas-lab-runner on NAS-LAB (BazziteTV's runner is busy with Deskpost checks)
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      PUBLIC_REPO: github.com/eKioga/homelab-compose
    steps:
      - name: Check out the whole history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -eu
          arch=$(uname -m); case "$arch" in x86_64) a=x64;; aarch64) a=arm64;; *) echo "no gitleaks for $arch"; exit 1;; esac
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_${a}.tar.gz"
          curl -fsSL -o "/tmp/$file" "$base/$file"
          curl -fsSL -o /tmp/checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd /tmp && grep " $file\$" checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/$file" -C /usr/local/bin gitleaks

      - name: Scan the whole history and the files
        run: |
          set -eu
          gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
          gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Push main to the public copy
        env:
          TOKEN: ${{ secrets.PUBLIC_MIRROR_TOKEN }}
        run: |
          set -eu
          test -n "$TOKEN" || { echo "secret PUBLIC_MIRROR_TOKEN is missing"; exit 1; }
          git push "https://x-access-token:${TOKEN}@${PUBLIC_REPO}.git" "HEAD:refs/heads/main"
